# ──────────────────────────────────────────────
# Smart AI CCTV Assistant – Configuration
# ──────────────────────────────────────────────

camera:
  # RTSP stream URL from IP Webcam app (Android)
  # Example: "rtsp://192.168.1.100:8080/h264_ulaw.sdp"
  stream_url: "0"                       # "0" = laptop webcam fallback
  frame_width: 640
  frame_height: 480
  fps: 15
  skip_frames: 5                        # Process every Nth frame

detection:
  yolo_model: "yolov8n.pt"              # YOLOv8 nano (fast)
  confidence_threshold: 0.5
  iou_threshold: 0.45
  target_classes:
    - person
    - bottle
    - cup
    - knife
    - spoon
    - bowl
    - banana
    - apple
    - sandwich
    - orange
    - broccoli
    - carrot
    - hot dog
    - pizza
    - donut
    - cake
    - chair
    - couch
    - potted plant
    - bed
    - dining table
    - toilet
    - tv
    - laptop
    - mouse
    - remote
    - keyboard
    - cell phone
    - microwave
    - oven
    - toaster
    - sink
    - refrigerator
    - book
    - clock
    - vase
    - scissors
    - teddy bear
    - hair drier
    - toothbrush

face_recognition:
  known_faces_dir: "data/faces"
  encodings_file: "models/face/known_faces.pkl"
  tolerance: 0.5
  model: "hog"                          # "hog" (CPU) or "cnn" (GPU)

database:
  path: "database/events.db"

events:
  deduplication_window_seconds: 30      # Suppress duplicate events within N seconds
  clip_duration_seconds: 8              # Video clip length on event trigger
  clip_save_dir: "data/recordings"

vector_store:
  index_path: "vector_store/faiss_store.index"
  metadata_path: "vector_store/event_metadata.pkl"
  embedding_model: "all-MiniLM-L6-v2"

llm:
  provider: "openai"                    # "openai" or "local"
  model: "gpt-3.5-turbo"
  temperature: 0.3
  max_tokens: 300

telegram:
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  alert_chat_id_env: "TELEGRAM_CHAT_ID"

alerts:
  enabled: true
  unknown_person: true
  night_movement: true
  door_activity: true
  night_start_hour: 22                  # 10 PM
  night_end_hour: 6                     # 6 AM

logging:
  level: "INFO"
  log_file: "data/logs/cctv_assistant.log"
